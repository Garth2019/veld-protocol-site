<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Veld</title>
  <defs>
    <filter id="veldIconGrain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.910
                0 0 0 0 0.780
                0 0 0 0 0.400
                0 0 0 0.30 0" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- Obsidian block -->
  <rect width="64" height="64" rx="15" fill="#07090C"/>
  <!-- Sparse gold grain on the block -->
  <rect width="64" height="64" rx="15" fill="#000" filter="url(#veldIconGrain)"/>
  <!-- Chunky gold "v" -->
  <path d="M18.5 21 L32 44 L45.5 21" fill="none" stroke="#E8C766"
        stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
