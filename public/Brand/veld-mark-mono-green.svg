    <circle cx="100" cy="125" r="4.5" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="1" />
    <circle cx="120" cy="90" r="4.5" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="1" />
    <circle cx="145" cy="55" r="4.5" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="1" />
    <circle cx="170" cy="30" r="4.5" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="1" />
    <circle cx="75" cy="60" r="4.5" fill="#2D6A4F" stroke="#2D6A4F" stroke-width="1" />
