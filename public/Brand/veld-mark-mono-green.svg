<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" stroke-linecap="round" stroke-linejoin="round">
  <title>Veld Protocol Monochrome Green</title>
  <desc>Node-graph V mark on horizon line</desc>
