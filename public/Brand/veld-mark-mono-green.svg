    <line x1="100" y1="125" x2="120" y2="90" stroke="#2D6A4F" stroke-width="2" />
    <line x1="120" y1="90" x2="145" y2="55" stroke="#2D6A4F" stroke-width="2" />
    <line x1="145" y1="55" x2="170" y2="30" stroke="#2D6A4F" stroke-width="2" />
    <line x1="30" y1="30" x2="75" y2="60" stroke="#2D6A4F" stroke-width="2" />
    <line x1="75" y1="60" x2="55" y2="55" stroke="#2D6A4F" stroke-width="2" />
    <line x1="75" y1="60" x2="80" y2="90" stroke="#2D6A4F" stroke-width="2" />
    <line x1="55" y1="55" x2="125" y2="60" stroke="#2D6A4F" stroke-width="2" />
    <line x1="125" y1="60" x2="145" y2="55" stroke="#2D6A4F" stroke-width="2" />
    <line x1="170" y1="30" x2="125" y2="60" stroke="#2D6A4F" stroke-width="2" />
    <line x1="125" y1="60" x2="120" y2="90" stroke="#2D6A4F" stroke-width="2" />
    <line x1="75" y1="60" x2="100" y2="125" stroke="#2D6A4F" stroke-width="2" />
    <line x1="125" y1="60" x2="100" y2="125" stroke="#2D6A4F" stroke-width="2" />
    <line x1="30" y1="30" x2="170" y2="30" stroke="#2D6A4F" stroke-width="2.5" />
    <line x1="75" y1="60" x2="125" y2="60" stroke="#2D6A4F" stroke-width="2.5" />
